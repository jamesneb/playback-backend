services:
  # ClickHouse - Primary telemetry database
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    hostname: clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native TCP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config-local.xml:/etc/clickhouse-server/config.xml
      - ./clickhouse/users-local.xml:/etc/clickhouse-server/users.xml
    networks:
      - telemetry_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8123/ping",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Multi-tier caching
  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass redis123 --appendonly yes
    networks:
      - telemetry_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LocalStack - AWS services emulation
  localstack:
    image: localstack/localstack:2.3
    hostname: localstack
    ports:
      - "4566:4566" # LocalStack Gateway
      - "4510-4559:4510-4559" # External services port range
    environment:
      - SERVICES=kinesis,lambda,s3,iam,sts,logs
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
      - HOST_TMP_FOLDER=${TMPDIR:-/tmp}/localstack
      - KINESIS_ERROR_PROBABILITY=0.0
      - KINESIS_LATENCY=0
      - PERSISTENCE=1
    volumes:
      - "${TMPDIR:-/tmp}/localstack:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack_data:/tmp/localstack/data
    networks:
      - telemetry_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Database migration service
  db-migrate:
    build:
      context: ../..
      dockerfile: Dockerfile.migrate
    environment:
      - ENV=local-docker
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ../../db:/app/db:ro
      - ../../config:/app/config:ro
      - ../../environments:/app/environments:ro
      - ../../pkg:/app/pkg:ro
    networks:
      - telemetry_network
    restart: "no"

  # S3 bucket initialization
  s3-init:
    image: curlimages/curl:latest
    depends_on:
      localstack:
        condition: service_healthy
    command: |
      sh -c "
        echo 'Creating S3 bucket: replays'
        curl -X PUT http://localstack:4566/replays
        echo 'S3 bucket created successfully'
      "
    networks:
      - telemetry_network

  # Kinesis streams initialization  
  kinesis-init:
    image: localstack/localstack-pro:latest
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    entrypoint: []
    command:
      - sh
      - -c
      - |
        echo 'Installing awscli...'
        apk add --no-cache aws-cli
        echo 'Creating Kinesis streams...'
        aws kinesis create-stream --stream-name telemetry-traces --shard-count 1 --endpoint-url http://localstack:4566 --region us-east-1 || echo 'Stream creation failed'
        aws kinesis create-stream --stream-name telemetry-metrics --shard-count 1 --endpoint-url http://localstack:4566 --region us-east-1 || echo 'Stream creation failed'  
        aws kinesis create-stream --stream-name telemetry-logs --shard-count 1 --endpoint-url http://localstack:4566 --region us-east-1 || echo 'Stream creation failed'
        echo 'Checking streams...'
        aws kinesis list-streams --endpoint-url http://localstack:4566 --region us-east-1
        echo 'Kinesis streams setup completed'
    networks:
      - telemetry_network

  # Playback Backend - Your main service
  playback-backend:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile
      target: server
    hostname: playback-backend
    ports:
      - "8080:8080" # HTTP/JSON API
      - "4317:4317" # gRPC/OTLP
    environment:
      - ENV=local
      - CLICKHOUSE_HOST=clickhouse:9000
      - CLICKHOUSE_DB=telemetry
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=admin123
      - REDIS_HOST=redis:6379
      - REDIS_PASSWORD=redis123
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - KINESIS_STREAM_TRACES=telemetry-traces
      - KINESIS_STREAM_METRICS=telemetry-metrics
      - KINESIS_STREAM_LOGS=telemetry-logs
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      kinesis-init:
        condition: service_completed_successfully
    networks:
      - telemetry_network
    volumes:
      - ../../config:/app/config:ro

  # Kinesis Consumer - Processes stream data and writes to ClickHouse
  kinesis-consumer:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile
      target: consumer
    hostname: kinesis-consumer
    environment:
      - ENV=local
      - CLICKHOUSE_HOST=clickhouse:9000
      - CLICKHOUSE_DB=telemetry
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=admin123
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      clickhouse:
        condition: service_healthy
      localstack:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - telemetry_network
    volumes:
      - ../../config:/app/config:ro

  # Order Service - Test data generator
  order-service:
    build:
      context: ../../examples/order-service-working
      dockerfile: Dockerfile
    hostname: order-service
    ports:
      - "8081:8081"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://playback-backend:4317
      - ENVIRONMENT=local
    depends_on:
      - playback-backend
    networks:
      - telemetry_network

  # Load Test - Continuous order generation for telemetry
  load-test:
    build:
      context: ../../examples/load-test
      dockerfile: Dockerfile
    hostname: load-test
    environment:
      - ORDER_SERVICE_URL=http://order-service:8081
      - REQUESTS_PER_SEC=5
      - DURATION_SEC=3600 # Run for 1 hour
      - MAX_CONCURRENT=10
    depends_on:
      - order-service
    networks:
      - telemetry_network
    restart: unless-stopped

networks:
  telemetry_network:
    driver: bridge

volumes:
  clickhouse_data:
  redis_data:
  localstack_data:


// Complete OTLP Trace protobuf schema for ClickHouse
// Based on official OpenTelemetry Protocol specification v1.7.0
// Includes all message types from trace.proto, common.proto, and resource.proto

syntax = "proto3";

package opentelemetry.proto.trace.v1;

// Main data container for traces
message TracesData {
  repeated ResourceSpans resource_spans = 1;
}

// Resource spans data
message ResourceSpans {
  Resource resource = 1;
  repeated ScopeSpans scope_spans = 2;
  string schema_url = 3;
}

// Scope-specific spans
message ScopeSpans {
  InstrumentationScope scope = 1;
  repeated Span spans = 2;
  string schema_url = 3;
}

// Core Span message with all OTLP fields
message Span {
  bytes trace_id = 1;
  bytes span_id = 2;
  string trace_state = 3;
  bytes parent_span_id = 4;
  fixed32 flags = 16;  // W3C trace flags
  string name = 5;
  
  enum SpanKind {
    SPAN_KIND_UNSPECIFIED = 0;
    SPAN_KIND_INTERNAL = 1;
    SPAN_KIND_SERVER = 2;
    SPAN_KIND_CLIENT = 3;
    SPAN_KIND_PRODUCER = 4;
    SPAN_KIND_CONSUMER = 5;
  }
  SpanKind kind = 6;
  
  fixed64 start_time_unix_nano = 7;
  fixed64 end_time_unix_nano = 8;
  
  repeated KeyValue attributes = 9;
  uint32 dropped_attributes_count = 10;
  
  message Event {
    fixed64 time_unix_nano = 1;
    string name = 2;
    repeated KeyValue attributes = 3;
    uint32 dropped_attributes_count = 4;
  }
  repeated Event events = 11;
  uint32 dropped_events_count = 12;
  
  message Link {
    bytes trace_id = 1;
    bytes span_id = 2;
    string trace_state = 3;
    repeated KeyValue attributes = 4;
    uint32 dropped_attributes_count = 5;
    uint32 flags = 6;
  }
  repeated Link links = 13;
  uint32 dropped_links_count = 14;
  
  Status status = 15;
}

// Status message
message Status {
  enum StatusCode {
    STATUS_CODE_UNSET = 0;
    STATUS_CODE_OK = 1;
    STATUS_CODE_ERROR = 2;
  }
  
  StatusCode code = 1;
  string message = 2;
}

// Resource definition (from resource.proto)
message Resource {
  repeated KeyValue attributes = 1;
  uint32 dropped_attributes_count = 2;
  repeated EntityRef entity_refs = 3;
}

// Instrumentation Scope (from common.proto)
message InstrumentationScope {
  string name = 1;
  string version = 2;
  repeated KeyValue attributes = 3;
  uint32 dropped_attributes_count = 4;
}

// Key-Value pair (from common.proto)
message KeyValue {
  string key = 1;
  AnyValue value = 2;
}

// Any value type (from common.proto)
message AnyValue {
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    int64 int_value = 3;
    double double_value = 4;
    ArrayValue array_value = 5;
    KeyValueList kvlist_value = 6;
    bytes bytes_value = 7;
  }
}

// Array of values (from common.proto)
message ArrayValue {
  repeated AnyValue values = 1;
}

// List of key-value pairs (from common.proto)
message KeyValueList {
  repeated KeyValue values = 1;
}

// Entity reference (from common.proto)
message EntityRef {
  string schema_url = 1;
  string type = 2;
  repeated string id_keys = 3;
  repeated string description_keys = 4;
}
// Complete OTLP Metrics protobuf schema for ClickHouse
// Based on official OpenTelemetry Protocol specification v1.7.0
// Includes all message types from metrics.proto, common.proto, and resource.proto

syntax = "proto3";

package opentelemetry.proto.metrics.v1;

// Main data container for metrics
message MetricsData {
  repeated ResourceMetrics resource_metrics = 1;
}

// Resource metrics data
message ResourceMetrics {
  Resource resource = 1;
  repeated ScopeMetrics scope_metrics = 2;
  string schema_url = 3;
}

// Scope-specific metrics
message ScopeMetrics {
  InstrumentationScope scope = 1;
  repeated Metric metrics = 2;
  string schema_url = 3;
}

// Core Metric message with all OTLP fields
message Metric {
  string name = 1;
  string description = 2;
  string unit = 3;
  
  oneof data {
    Gauge gauge = 5;
    Sum sum = 7;
    Histogram histogram = 9;
    ExponentialHistogram exponential_histogram = 10;
    Summary summary = 11;
  }
  
  // Metadata attributes
  repeated KeyValue metadata = 12;
}

// Gauge metric
message Gauge {
  repeated NumberDataPoint data_points = 1;
}

// Sum metric
message Sum {
  repeated NumberDataPoint data_points = 1;
  AggregationTemporality aggregation_temporality = 2;
  bool is_monotonic = 3;
}

// Histogram metric
message Histogram {
  repeated HistogramDataPoint data_points = 1;
  AggregationTemporality aggregation_temporality = 2;
}

// Exponential histogram metric
message ExponentialHistogram {
  repeated ExponentialHistogramDataPoint data_points = 1;
  AggregationTemporality aggregation_temporality = 2;
}

// Summary metric
message Summary {
  repeated SummaryDataPoint data_points = 1;
}

// Number data point
message NumberDataPoint {
  repeated KeyValue attributes = 7;
  fixed64 start_time_unix_nano = 2;
  fixed64 time_unix_nano = 3;
  
  oneof value {
    double as_double = 4;
    sfixed64 as_int = 6;
  }
  
  repeated Exemplar exemplars = 5;
  uint32 flags = 8;
}

// Histogram data point
message HistogramDataPoint {
  repeated KeyValue attributes = 9;
  fixed64 start_time_unix_nano = 2;
  fixed64 time_unix_nano = 3;
  uint64 count = 4;
  optional double sum = 5;
  repeated uint64 bucket_counts = 6;
  repeated double explicit_bounds = 7;
  repeated Exemplar exemplars = 8;
  uint32 flags = 10;
  optional double min = 11;
  optional double max = 12;
  uint64 zero_count = 13;
}

// Exponential histogram data point
message ExponentialHistogramDataPoint {
  repeated KeyValue attributes = 1;
  fixed64 start_time_unix_nano = 2;
  fixed64 time_unix_nano = 3;
  uint64 count = 4;
  optional double sum = 5;
  sint32 scale = 6;
  uint64 zero_count = 7;
  
  message Buckets {
    sint32 offset = 1;
    repeated uint64 bucket_counts = 2;
  }
  
  Buckets positive = 8;
  Buckets negative = 9;
  uint32 flags = 10;
  repeated Exemplar exemplars = 11;
  optional double min = 12;
  optional double max = 13;
  uint64 zero_threshold = 14;
}

// Summary data point
message SummaryDataPoint {
  repeated KeyValue attributes = 7;
  fixed64 start_time_unix_nano = 2;
  fixed64 time_unix_nano = 3;
  uint64 count = 4;
  double sum = 5;
  
  message ValueAtQuantile {
    double quantile = 1;
    double value = 2;
  }
  
  repeated ValueAtQuantile quantile_values = 6;
  uint32 flags = 8;
}

// Exemplar for metrics
message Exemplar {
  repeated KeyValue filtered_attributes = 7;
  fixed64 time_unix_nano = 2;
  
  oneof value {
    double as_double = 3;
    sfixed64 as_int = 6;
  }
  
  string span_id = 4;
  string trace_id = 5;
}

// Aggregation temporality
enum AggregationTemporality {
  AGGREGATION_TEMPORALITY_UNSPECIFIED = 0;
  AGGREGATION_TEMPORALITY_DELTA = 1;
  AGGREGATION_TEMPORALITY_CUMULATIVE = 2;
}

// Resource definition (from resource.proto)
message Resource {
  repeated KeyValue attributes = 1;
  uint32 dropped_attributes_count = 2;
  repeated EntityRef entity_refs = 3;
}

// Instrumentation Scope (from common.proto)
message InstrumentationScope {
  string name = 1;
  string version = 2;
  repeated KeyValue attributes = 3;
  uint32 dropped_attributes_count = 4;
}

// Key-Value pair (from common.proto)
message KeyValue {
  string key = 1;
  AnyValue value = 2;
}

// Any value type (from common.proto)
message AnyValue {
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    int64 int_value = 3;
    double double_value = 4;
    ArrayValue array_value = 5;
    KeyValueList kvlist_value = 6;
    bytes bytes_value = 7;
  }
}

// Array of values (from common.proto)
message ArrayValue {
  repeated AnyValue values = 1;
}

// List of key-value pairs (from common.proto)
message KeyValueList {
  repeated KeyValue values = 1;
}

// Entity reference (from common.proto)
message EntityRef {
  string schema_url = 1;
  string type = 2;
  repeated string id_keys = 3;
  repeated string description_keys = 4;
}
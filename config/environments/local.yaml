# Consolidated Local Development Configuration - 4 logical sections instead of 16+
# Clean, maintainable, and performant configuration structure

app:
  name: "playback-backend"
  version: "1.0.0"
  environment: "local"
  log_level: "debug"
  log_format: "json"

network:
  http:
    host: "0.0.0.0"
    port: 8080
    mode: "debug"
    read_timeout: "30s"
    write_timeout: "30s"
    idle_timeout: "60s"
    shutdown_timeout: "30s"
    max_request_size_mb: 25
    max_header_size_kb: 1024
    api_prefix: "/api/v1"
    trusted_proxies: []
    enable_cors: true
    cors_origins: ["*"]
    rate_limit_rps: 1000
    rate_limit_burst: 2000
    enable_auth: false
    jwt_secret: "dev-secret-key"
    jwt_expiry_hours: 24
    enable_swagger: true
    swagger_path: "/swagger"
    enable_debug: true
  grpc:
    port: 4317
    max_recv_size_mb: 16
    max_send_size_mb: 16
    connection_timeout: "30s"

data:
  clickhouse:
    host: "localhost:9000"
    http_host: "localhost:8123"
    database: "telemetry"
    username: "admin"
    password: "admin123"
    max_connections: 10
    max_idle_connections: 5
    connection_timeout: "30s"
    enable_compression: true
  redis:
    host: "localhost:6379"
    password: "redis123"
    database: 0
    max_connections: 10
    max_idle_connections: 5
    connection_timeout: "5s"
    default_ttl: "5m"
  s3:
    region: "us-east-1"
    bucket: "replays"
    endpoint_url: "http://localhost:4566"
    access_key_id: "test"
    secret_access_key: "test"
    force_path_style: true
  kinesis:
    region: "us-east-1"
    endpoint_url: "http://localhost:4566"
    access_key_id: "test"
    secret_access_key: "test"
    traces_stream: "telemetry-traces"
    metrics_stream: "telemetry-metrics"
    logs_stream: "telemetry-logs"
    batch_size: 100
    flush_interval: "5s"
    max_retries: 3
    retry_delay: "1s"
  # Data processing settings
  batch_size: 1000
  flush_interval: "5s"
  worker_count: 4
  max_queue_size: 10000
  enable_compression: true
  # Retention policies (days)
  retention_traces: 7
  retention_metrics: 30
  retention_logs: 7

operations:
  # Monitoring and observability
  enable_metrics: true
  metrics_port: 9090
  metrics_path: "/metrics"
  enable_tracing: true
  tracing_endpoint: ""
  health_path: "/health"
  # Resilience patterns
  circuit_breaker_enabled: true
  circuit_breaker_threshold: 0.6
  circuit_breaker_timeout: "10s"
  # Performance optimizations
  enable_connection_pooling: true
  connection_max_lifetime: "30m"
  # Development settings
  is_development: true
  mock_external_services: true
  enable_query_logging: true


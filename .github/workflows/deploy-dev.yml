name: Deploy to Development

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: 'false'

env:
  ENVIRONMENT: dev
  AWS_REGION: us-east-1
  ECR_REPOSITORY: playback-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Run tests
      run: make ci

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success() || github.event.inputs.force_deploy == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build with development environment
        docker build \
          --build-arg ENV=${{ env.ENVIRONMENT }} \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.ENVIRONMENT }}-latest \
          -f deployments/Dockerfile .
        
        # Push both tags
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.ENVIRONMENT }}-latest

    - name: Deploy infrastructure
      run: |
        cd infrastructure/terraform/environments/${{ env.ENVIRONMENT }}
        terraform init
        terraform plan -var-file="../../../environments/${{ env.ENVIRONMENT }}/terraform.tfvars"
        terraform apply -auto-approve -var-file="../../../environments/${{ env.ENVIRONMENT }}/terraform.tfvars"

    - name: Deploy application
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Update ECS service or Lambda function with new image
        aws ecs update-service \
          --cluster playback-backend-${{ env.ENVIRONMENT }} \
          --service playback-backend-service \
          --force-new-deployment \
          --task-definition playback-backend-${{ env.ENVIRONMENT }}

    - name: Run smoke tests
      run: |
        # Wait for deployment
        sleep 60
        
        # Test health endpoint
        curl -f https://api-${{ env.ENVIRONMENT }}.playback-backend.com/health || exit 1
        
        # Test basic functionality
        make test-load ENVIRONMENT=${{ env.ENVIRONMENT }}

    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
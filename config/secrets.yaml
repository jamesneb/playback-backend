# Secrets Management Configuration
# Production-grade secrets management with multiple provider support

# Default configuration for local development
default_provider: "file"
cache_ttl: "5m"

# Environment-specific providers
environments:
  local:
    provider: "file"
    file:
      store_path: "./config/.secrets"
      encryption_key: "${SECRETS_ENCRYPTION_KEY:-dev-encryption-key-change-in-production}"
      backup_count: 3
      file_mode: "0600"

  staging:
    provider: "aws"
    aws:
      region: "${AWS_REGION:-us-east-1}"
      secret_prefix: "staging/playback-backend/"
      rotation_enabled: true
      endpoint_url: "${AWS_ENDPOINT_URL:-}"

  production:
    provider: "aws"
    aws:
      region: "${AWS_REGION}"
      secret_prefix: "prod/playback-backend/"
      rotation_enabled: true
      assume_role: "${AWS_SECRETS_ROLE_ARN:-}"

# Fallback to Vault for enterprises with existing Vault infrastructure
vault:
  address: "${VAULT_ADDR:-https://vault.company.com}"
  mount: "secret/v2"
  namespace: "${VAULT_NAMESPACE:-}"
  auth_method: "aws" # or "approle", "kubernetes", etc.
  role_id: "${VAULT_ROLE_ID:-}"
  secret_id: "${VAULT_SECRET_ID:-}"
  ca_cert: "${VAULT_CA_CERT:-}"
  insecure_skip_verify: false

# Secret definitions with metadata
secrets:
  # Database secrets
  clickhouse:
    password:
      key: "CLICKHOUSE_PASSWORD"
      description: "ClickHouse database password"
      rotation_days: 90
      required: true
    username:
      key: "CLICKHOUSE_USERNAME"
      description: "ClickHouse database username"
      required: true
      default: "admin"

  redis:
    password:
      key: "REDIS_PASSWORD"
      description: "Redis cache password"
      rotation_days: 90
      required: true

  # AWS credentials
  aws:
    access_key_id:
      key: "AWS_ACCESS_KEY_ID"
      description: "AWS access key ID"
      rotation_days: 30
      required: true
    secret_access_key:
      key: "AWS_SECRET_ACCESS_KEY"
      description: "AWS secret access key"
      rotation_days: 30
      required: true
      sensitive: true

  # Application secrets
  jwt:
    secret:
      key: "JWT_SECRET"
      description: "JWT signing secret"
      rotation_days: 7
      required: true
      min_length: 32
      sensitive: true

  # TLS certificates
  tls:
    cert_file:
      key: "TLS_CERT_FILE"
      description: "TLS certificate file path"
      required_envs: ["staging", "production"]
    key_file:
      key: "TLS_KEY_FILE"
      description: "TLS private key file path"
      required_envs: ["staging", "production"]
      sensitive: true

  # Monitoring secrets
  jaeger:
    endpoint:
      key: "JAEGER_ENDPOINT"
      description: "Jaeger tracing endpoint"
      required: false
      default: "http://localhost:14268/api/traces"

# Security policies
security:
  # Require secrets rotation
  enforce_rotation: true
  max_age_days: 90

  # Audit logging
  enable_audit_log: true
  audit_log_path: "/var/log/secrets-audit.log"

  # Secret validation
  validate_on_load: true
  validation_rules:
    min_password_length: 16
    require_special_chars: true
    forbid_common_passwords: true

  # Encryption settings
  encryption:
    algorithm: "AES-256-GCM"
    key_derivation: "PBKDF2"
    iterations: 100000

# Performance settings
performance:
  cache_enabled: true
  cache_size: 1000
  cache_ttl: "5m"
  preload_secrets: true
  batch_operations: true

# Development settings
development:
  allow_plaintext: false
  mock_providers: false
  debug_logging: false
  validate_required: true